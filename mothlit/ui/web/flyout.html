<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mothlit · quick controls</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="flyout.css">
</head>
<body class="flyout">
<div class="panel" id="panel">

  <header class="fly-header">
    <img class="fly-logo" src="moth.svg" alt="">
    <span class="fly-title">Mothlit</span>
    <button class="icon-button" id="fly-expand" title="Open the full Mothlit" data-icon="expand"></button>
  </header>

  <section class="fly-section off" id="fly-light">
    <div class="fly-row">
      <span class="fly-icon" id="fly-light-icon" data-icon="bulb"></span>
      <div class="fly-texts">
        <strong id="fly-light-name">Lamp</strong>
        <small class="state-text" id="fly-light-state">Connecting…</small>
      </div>
      <button class="power" id="fly-light-power" title="Turn on/off" data-icon="power"></button>
      <button class="fly-open" data-tab="light" title="Open on the Light tab" data-icon="right"></button>
    </div>
    <div class="fly-control">
      <span class="muted-icon" data-icon="sun"></span>
      <input type="range" class="slider" id="fly-brightness" min="1" max="100" step="1" value="1">
      <span class="value" id="fly-brightness-value">–</span>
    </div>
  </section>

  <section class="fly-section off" id="fly-ac">
    <div class="fly-row">
      <span class="fly-icon" data-icon="snowflake"></span>
      <div class="fly-texts">
        <strong id="fly-ac-name">Air conditioner</strong>
        <small class="state-text" id="fly-ac-state">Connecting…</small>
      </div>
      <button class="power" id="fly-ac-power" title="Turn on/off" data-icon="power"></button>
      <button class="fly-open" data-tab="climate" title="Open on the Climate tab" data-icon="right"></button>
    </div>
    <div class="fly-control fly-temp">
      <button class="icon-button" id="fly-minus" title="Decrease" data-icon="minus"></button>
      <div class="fly-target"><span id="fly-target">–</span><small>°C</small></div>
      <button class="icon-button" id="fly-plus" title="Increase" data-icon="plus"></button>
    </div>
  </section>

</div>
<script src="common.js"></script>
<script src="flyout.js"></script>
</body>
</html>
