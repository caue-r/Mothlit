[project]
name = "mothlit"
version = "0.1.0"
description = "Controle da lâmpada Tuya e do ar-condicionado Samsung pelo PC"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.4",
    "pywebview>=6.2.1",
    "tinytuya>=1.20.0",
]

[project.scripts]
mothlit = "mothlit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mothlit"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
